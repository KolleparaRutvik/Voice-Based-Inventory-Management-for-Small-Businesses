services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaansetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dukaansetu-production-secret-key}
    volumes:
      - ./database:/app/database:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dukaansetu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
